# dsh-proxy configuration.
#
# The proxy starts DSH_CMD, reads the `dsh web: http://...?token=...` line from
# its output, exchanges that launch token for DSH's signed session cookie, and
# injects the cookie into every request it forwards.

# Where clients connect. 0.0.0.0 listens on every interface; use a concrete
# LAN/VPN address if you want to restrict the listener.
#
# WARNING: the proxy injects its DSH credential into every request it accepts.
# Anyone who can reach this address has the same access as DSH itself (which
# includes running commands). Bind it to a trusted network, never the public
# internet, and firewall the port.
LISTEN=0.0.0.0:8080

# Command that boots DSH. Keep --no-open for a service. If dsh is not on the
# service PATH, put its absolute path here (the install script does this for
# you), or use:
#   DSH_CMD=npx @deepseek-ai/dsh web --no-open
DSH_CMD=dsh web --no-open

# dsh's own port. 0 means the OS picks a free high port on every start; the
# proxy reads the actual port from the `dsh web: ...?token=...` line, so no
# port needs to be reserved or matched here. Set a fixed port only if you
# really need one (the proxy also respects a --port already present in
# DSH_CMD and then ignores this key).
DSH_PORT=0

# Optional: DSH_HOME. Defaults to the service user's ~/.dsh.
# DSH_HOME=/home/lbh/.dsh

# Optional: force the upstream address. Needed only when dsh prints a
# --public-url that is not reachable locally; the token is still read from the
# printed URL.
# UPSTREAM=127.0.0.1:3080

# Seconds between "no token yet" warnings. The proxy never kills dsh while it
# is installing or updating; it waits for the token line.
TOKEN_TIMEOUT=180

# Base delay before restarting dsh after it exits (exponential up to 30s).
RESTART_DELAY=5

# Re-exchange the launch token for a fresh cookie this often, in seconds.
# DSH's browser cookie lifetime is 30 days by default.
COOKIE_REFRESH=21600

# Automatically answer install/update prompts (y/N, "Ok to proceed?", ...)
# with `y`. Set to 0 if you want to answer manually.
AUTO_YES=1

# error, warn, info, debug
LOG_LEVEL=info
